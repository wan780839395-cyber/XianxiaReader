name: iOS Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      resolve_local_readium:
        description: First real local Readium resolution; adopt artifact then rerun with this off
        type: boolean
        default: false
      diagnostic_selection:
        description: Full by default; unit-release requires verified identical UI inputs; diagnostics never package
        type: choice
        default: full
        options: [full, fonts-full, unit-release, native-input, fonts, panels, recovery, settings, settings-ui, webkit-loading, webkit-close, paged-restore, reader-session, recording-control, reader-ready-ui, background-ui, continuous-rotation, preferences-idempotency, initialization-pending, rotation-full, reader-logic, reader-logic-integration, font-isolation, position-observation, position-fix, paged-font, paged-font-control, position-isolation, epub-ready-control, continuous-return]

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install static validation dependencies
        run: python -m pip install -r scripts/requirements-checks.txt
      - name: Validate repository and Swift syntax
        run: python scripts/check_repository.py --swift-syntax
      - name: Test simulator selection and IPA packaging safeguards
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  core-tests:
    if: ${{ inputs.diagnostic_selection != 'reader-logic' && inputs.diagnostic_selection != 'reader-logic-integration' && inputs.diagnostic_selection != 'position-isolation' && inputs.diagnostic_selection != 'epub-ready-control' && inputs.diagnostic_selection != 'continuous-return' }}
    needs: repository-checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: swift:6.1.2-jammy@sha256:1122c18e938491180820e9b4902c489dadd5a89f7e6bd99ff9b64e7f1b18f41f
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite development headers inside test container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Compile and test Core with official Swift toolchain
        run: |
          set -euo pipefail
          mkdir -p build/logs
          swift --version 2>&1 | tee build/logs/core-environment.log
          swift test --package-path Packages/XianxiaCore --parallel 2>&1 | tee build/logs/core-tests.log
      - name: Measure Release TXT cold import and bounded long-book reopen
        run: |
          set -euo pipefail
          swift build --package-path Packages/XianxiaCore --configuration release --product TXTPerformanceProbe 2>&1 | tee build/logs/txt-probe-build.log
          PROBE_BIN=$(swift build --package-path Packages/XianxiaCore --configuration release --show-bin-path)
          python3 scripts/run_txt_performance.py --binary "$PROBE_BIN/TXTPerformanceProbe" --output build/TXTPerformance 2>&1 | tee build/logs/txt-performance.log
      - name: Upload Core compilation and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XianxiaReader-core-diagnostics
          if-no-files-found: warn
          path: |
            build/logs/
            build/TXTPerformance/

  reader-logic:
    if: ${{ inputs.diagnostic_selection == 'reader-logic' || inputs.diagnostic_selection == 'reader-logic-integration' }}
    needs: repository-checks
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run settings contracts without App host or Readium
        run: bash scripts/test_reader_logic.sh
      - name: Validate original iOS settings and lifecycle integration
        if: ${{ inputs.diagnostic_selection == 'reader-logic-integration' }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/ci_reader_diagnostic.sh settings 2>&1 | tee build/logs/settings-integration.log
      - name: Preserve original logic and optional integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XianxiaReader-reader-logic
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/logs/
            build/ReaderLogic/
            build/DiagnosticTests.xcresult/
            build/ReaderSnapshots/
            build/test-results-summary.json
            build/build-environment.txt

  reader-positions:
    if: ${{ inputs.diagnostic_selection == 'position-isolation' || inputs.diagnostic_selection == 'epub-ready-control' || inputs.diagnostic_selection == 'continuous-return' }}
    needs: repository-checks
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile isolated position contracts without App or Readium
        if: ${{ inputs.diagnostic_selection == 'position-isolation' }}
        run: bash scripts/test_reader_positions.sh
      - name: Validate original save and native anchor contracts
        if: ${{ inputs.diagnostic_selection == 'position-isolation' }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/ci_reader_diagnostic.sh position-isolation 2>&1 | tee build/logs/reader-diagnostic.log
          python3 scripts/verify_reader_positions.py native build --report build/ReaderPositions/native-receipt.json
      - name: Check native readiness with an exact old and new source pair
        if: ${{ inputs.diagnostic_selection == 'epub-ready-control' }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/ci_epub_ready_control.sh 2>&1 | tee build/logs/epub-ready-control-driver.log
      - name: Diagnose the original single return-position case
        if: ${{ inputs.diagnostic_selection == 'continuous-return' }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/ci_reader_diagnostic.sh continuous-return 2>&1 | tee build/logs/reader-diagnostic.log
      - name: Preserve original position contract and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.diagnostic_selection == 'continuous-return' && 'XianxiaReader-continuous-return' || inputs.diagnostic_selection == 'epub-ready-control' && 'XianxiaReader-epub-ready-control' || 'XianxiaReader-position-isolation' }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/logs/
            build/ReaderPositions/
            build/DiagnosticTests.xcresult/
            build/PositionBuild.xcresult/
            build/ReaderSnapshots/
            build/test-results-summary.json
            build/build-environment.txt
            build/EpubReadyControl/

  ios:
    if: ${{ !inputs.diagnostic_selection || inputs.diagnostic_selection == 'full' || inputs.diagnostic_selection == 'fonts-full' || inputs.diagnostic_selection == 'rotation-full' || inputs.diagnostic_selection == 'unit-release' }}
    needs: [repository-checks, core-tests]
    # Explicit 14GB Intel image; the macos-15 alias is a 7GB ARM VM.
    runs-on: macos-15-intel
    # Includes clean builds, full native tests, media export, device Release and upload.
    # Individual reader/test budgets remain unchanged.
    # Historical full job109m without Release; allow added6-case preflight, full179, device build and upload.
    # No individual assertion/test/production budget changes.
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      READIUM_RESOLVE_BOOTSTRAP: ${{ inputs.resolve_local_readium && '1' || '0' }}
      IOS_TEST_SCOPE: ${{ inputs.diagnostic_selection == 'unit-release' && 'unit-release' || 'full' }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Targeted font race preflight before full validation
        if: ${{ inputs.diagnostic_selection == 'fonts-full' }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/ci_reader_diagnostic.sh fonts 2>&1 | tee build/logs/font-preflight.log
          mv build/ReaderSnapshots build/FontPreflightSnapshots
          mv build/test-results-summary.json build/font-preflight-summary.json
      - name: Targeted continuous rotation preflight before full validation
        if: ${{ inputs.diagnostic_selection == 'rotation-full' }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/ci_reader_diagnostic.sh continuous-rotation 2>&1 | tee build/logs/continuous-rotation-preflight.log
          mv build/ReaderSnapshots build/ContinuousRotationPreflightSnapshots
          mv build/test-results-summary.json build/continuous-rotation-preflight-summary.json
      - name: Build, test, and package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/logs
          bash scripts/ci_ios.sh 2>&1 | tee build/logs/build.log
      - name: Upload build logs, test results, project, and resolved packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XianxiaReader-build-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/logs/
            build/*.xcresult/
            build/ReaderSnapshots/
            build/FontPreflightSnapshots/
            build/ContinuousRotationPreflightSnapshots/
            build/InteractionVideo/
            build/ReaderPositions/
            build/build-environment.txt
            build/Package*.resolved
            build/test-results-summary.json
            build/font-preflight-summary.json
            build/continuous-rotation-preflight-summary.json
            build/ui-baseline-receipt.json
            build/TXTPerformance/
            XianxiaReader.xcodeproj/
      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: XianxiaReader-unsigned-ipa
          if-no-files-found: error
          retention-days: 14
          path: build/XianxiaReader.ipa

  reading-diagnostic:
    if: ${{ inputs.diagnostic_selection && inputs.diagnostic_selection != 'full' && inputs.diagnostic_selection != 'fonts-full' && inputs.diagnostic_selection != 'rotation-full' && inputs.diagnostic_selection != 'unit-release' && inputs.diagnostic_selection != 'reader-logic' && inputs.diagnostic_selection != 'reader-logic-integration' && inputs.diagnostic_selection != 'position-isolation' && inputs.diagnostic_selection != 'epub-ready-control' && inputs.diagnostic_selection != 'continuous-return' }}
    needs: [repository-checks, core-tests]
    runs-on: macos-15-intel
    # The last cold native build reached its first test after28minutes.
    # Keep time for the selected tests and the original failure evidence.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      DIAGNOSTIC_SELECTION: ${{ inputs.diagnostic_selection }}
    steps:
      - uses: actions/checkout@v4
      - name: Run selected native diagnostics without device packaging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          if [[ "$DIAGNOSTIC_SELECTION" == 'paged-font-control' ]]; then
            bash scripts/ci_paged_font_control.sh baseline
          elif [[ "$DIAGNOSTIC_SELECTION" == 'recording-control' ]]; then
            bash scripts/ci_recording_control.sh 2>&1 | tee build/logs/reader-diagnostic.log
          elif [[ "$DIAGNOSTIC_SELECTION" == 'position-fix' ]]; then
            bash scripts/ci_position_offset_control.sh 2>&1 | tee build/logs/reader-diagnostic.log
          else
            bash scripts/ci_reader_diagnostic.sh "$DIAGNOSTIC_SELECTION" 2>&1 | tee build/logs/reader-diagnostic.log
          fi
      - name: Preserve paged font baseline text for diagnosis
        if: always() && inputs.diagnostic_selection == 'paged-font-control'
        uses: actions/upload-artifact@v4
        with:
          name: XianxiaReader-paged-font-baseline-text
          retention-days: 7
          if-no-files-found: error
          path: |
            build/PagedFontControl/baseline/logs/reader-diagnostic.log
            build/PagedFontControl/baseline/test-results-summary.json
            build/PagedFontControl/baseline/ReaderSnapshots/*.txt
            build/PagedFontControl/baseline/ReaderSnapshots/manifest.json
            build/PagedFontControl/baseline-inputs.json
            build/PagedFontControl/baseline-exits.txt
      - name: Validate reviewed paged font candidate on the same runner
        if: success() && inputs.diagnostic_selection == 'paged-font-control'
        shell: bash
        run: bash scripts/ci_paged_font_control.sh patched
      - name: Preserve diagnostic logs and original test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XianxiaReader-reader-diagnostic-${{ inputs.diagnostic_selection }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/logs/
            build/DiagnosticTests.xcresult/
            build/ReaderSnapshots/
            build/test-results-summary.json
            build/build-environment.txt
            build/Package.resolved
            build/RecordingControl/
            build/PositionControl/
            build/PagedFontControl/
